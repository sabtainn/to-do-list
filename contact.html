<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List - Contact</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        /* 1. RESET & VARIABLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #1f222a;
            --accent-blue: #2d8cf0;
            --accent-red: #ff477e;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --blue-light: #dbeafe;
        }

        /* 2. GLOBAL STYLES */
        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(45, 140, 240, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 71, 126, 0.1) 0%, transparent 20%);
            overflow-x: hidden;
        }

        /* 3. LAYOUT CONTAINER (Main Card) */
        .theme-card {
            width: 100%;
            max-width: 900px;
            min-height: 500px;
            display: flex;
            flex-direction: column; /* Mobile default */
            position: relative;
            background-color: rgba(36, 39, 48, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 
                0 25px 45px rgba(0,0,0,0.3),
                inset 0px 0px 30px rgba(255,255,255,0.05);
            animation: fade-in-up 0.8s ease-out forwards;
            z-index: 0;
        }

        /* 4. STATIC SHINY BORDER */
        .theme-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px; 
            padding: 2px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.4) 0%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.4) 100%
            );
            -webkit-mask: 
               linear-gradient(#fff 0 0) content-box, 
               linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            pointer-events: none;
        }

        /* 5. SECTIONS */
        .left-section {
            position: relative;
            width: 100%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            border-radius: 30px 30px 0 0;
            z-index: 10;
        }

        .diagonal-bg {
            background: linear-gradient(135deg, var(--accent-blue), #1a6bc7);
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: -1;
        }

        .right-section {
            position: relative;
            width: 100%;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 0 0 30px 30px;
            z-index: 20;
        }

        /* 6. TYPOGRAPHY & ELEMENTS */
        .header-title {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }
        .header-subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            color: var(--blue-light);
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .welcome-text {
            font-size: 0.875rem;
            color: var(--text-gray);
            margin-bottom: 2rem;
        }

        /* DEVELOPER LIST STYLES */
        .dev-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .dev-card {
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            gap: 0.2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
        }

        .dev-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .dev-info h4 {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .dev-info p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* 7. FORM ELEMENTS */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 0;
        }

        /* UPDATED ALIGNMENT LOGIC */
        .input-icon {
            position: absolute;
            top: 0; /* Anchor to top */
            left: 0;
            /* Height matches approx single-line input height (padding + font + line-height) */
            height: 3.2rem; 
            padding-left: 1.25rem;
            display: flex;
            align-items: center; /* Vertically center within the top 3.2rem */
            pointer-events: none;
            color: var(--text-gray);
        }

        .pill-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; 
            color: white;
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        textarea.pill-input {
            border-radius: 20px;
            resize: none;
            min-height: 120px;
        }

        .pill-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(45, 140, 240, 0.5);
            transform: translateY(-1px);
        }
        .pill-input::placeholder { color: rgba(255, 255, 255, 0.5); }

        .pill-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .pill-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-blue);
        }

        /* Footer Section */
        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .back-link {
            color: var(--text-gray);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            line-height: 1;
        }

        .back-link i {
            font-size: 1rem;
            position: relative;
            top: 1px; 
        }

        .back-link:hover {
            color: var(--accent-blue);
        }

        /* 8. TOAST NOTIFICATION */
        #toast {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            background-color: rgba(36, 39, 48, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 50;
            transform: translateX(150%);
            transition: transform 0.3s ease-in-out;
            overflow: hidden; 
        }
        #toast.show { transform: translateX(0); }

        #toast::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px; 
            padding: 2px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.4) 0%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.4) 100%
            );
            -webkit-mask: 
               linear-gradient(#fff 0 0) content-box, 
               linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            pointer-events: none;
        }

        .toast-icon-wrapper {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background-color: rgba(34, 197, 94, 0.8); 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .toast-message { font-weight: 500; }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 9. DESKTOP MEDIA QUERY */
        @media (min-width: 768px) {
            .theme-card {
                flex-direction: row;
            }
            .left-section {
                width: 41.666667%; 
                border-radius: 30px 0 0 30px; 
            }
            .right-section {
                width: 58.333333%; 
                border-radius: 0 30px 30px 0;
                padding: 3rem;
                border-left: 1px solid rgba(255, 255, 255, 0.1); 
            }
        }
    </style>
</head>
<body>

    <!-- MAIN CONTAINER -->
    <div class="theme-card">
        
        <!-- LEFT SIDE: Developer Info -->
        <div class="left-section">
            <div class="diagonal-bg"></div>
            
            <h1 class="header-title">Meet the Team</h1>
            <h2 class="header-subtitle">The minds behind the code.</h2>
            
            <div class="dev-list">
                
                <!-- Developer 1 -->
                <div class="dev-card">
                    <div class="dev-info">
                        <h4>Muhammad Sabtain</h4>
                        <p>k250696@nu.edu.pk</p>
                    </div>
                </div>

                <!-- Developer 2 -->
                <div class="dev-card">
                    <div class="dev-info">
                        <h4>Arqam Bin Amir</h4>
                        <p>k250830@nu.edu.pk</p>
                    </div>
                </div>

                <!-- Developer 3 -->
                <div class="dev-card">
                    <div class="dev-info">
                        <h4>Amaan Mairaj</h4>
                        <p>k250768@nu.edu.pk</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- RIGHT SIDE: Contact Form -->
        <div class="right-section">
            
            <div>
                <h3 class="section-title">Get in Touch</h3>
                <p class="welcome-text">Have a bug report or feature request?</p>
            </div>

            <!-- FORM -->
            <form id="contactForm">
                
                <!-- Email -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input 
                        type="email" 
                        id="email"
                        required
                        class="pill-input"
                        placeholder="Your Email Address"
                        autocomplete="off"
                    >
                </div>

                <!-- Query / Textarea -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-comment-alt"></i>
                    </div>
                    <textarea 
                        id="message"
                        required
                        class="pill-input"
                        placeholder="Describe your issue or query here..."
                    ></textarea>
                </div>
                
                <button type="submit" class="pill-btn">
                    <span>Send Message</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <!-- Footer: Back Link and Login Link -->
            <div class="login-footer">
                <a href="home.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Home
                </a>
                <span style="color: var(--text-gray); opacity: 0.5;">|</span>
                <a href="index.html" class="back-link">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast">
        <div class="toast-icon-wrapper">
            <i class="fas fa-check"></i>
        </div>
        <span id="toastMessage" class="toast-message">Message Sent!</span>
    </div>

    <script>
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.style.pointerEvents = 'none';

            // Simulate Network Request
            setTimeout(() => {
                showToast();
                btn.innerHTML = originalContent;
                btn.style.pointerEvents = 'auto';
                form.reset(); // Clear form
            }, 1500);
        });

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
